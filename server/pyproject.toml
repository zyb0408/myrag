[project]
name = "ragflow-chat-server"
version = "1.0.0"
description = "RAGFlow Knowledge QA BFF server (Python 3.10 rewrite)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ragflow-bff = "app.main:run"

[tool.uv]
package = false
